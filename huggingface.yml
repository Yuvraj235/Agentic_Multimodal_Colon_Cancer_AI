# ColonAI on Hugging Face Spaces

This is the live demo of the ColonAI research project. The source repo is on
GitHub: https://github.com/Yuvraj235/Agentic_Multimodal_Colon_Cancer_AI

When you upload a colonoscopy image, ColonAI:

1. Verifies the picture actually looks like a colonoscopy frame.
2. Runs the AI pipeline (6 specialised agents).
3. Cross-checks the agents against each other.
4. Shows a plain-English answer, a heat-map, and clear next steps.
5. **Refuses to answer** if any of its internal safety checks fail.

⚕️ Not a medical device. Every finding must be reviewed by a qualified
clinician before any clinical decision.

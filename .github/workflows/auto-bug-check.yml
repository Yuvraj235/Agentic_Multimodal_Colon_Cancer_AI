name: Daily auto-bug-check

on:
  # PAUSED 2026-06-08 for medical-grade pilot hardening: an unsupervised job
  # with contents:write that auto-commits "stale file" deletions must not run
  # on a clinical repo without a human-review gate. Re-enable by uncommenting
  # the cron below once changes go through PR review.
  # schedule:
  #   - cron: "0 4 * * *"   # daily 04:00 UTC
  # Manual trigger still allowed:
  workflow_dispatch:

permissions:
  contents: write          # push auto-cleanups
  issues:   write          # open an issue if a critical bug is found

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps for static analysis + live-status probe
        run: |
          pip install pyflakes playwright
          playwright install --with-deps chromium

      - name: Run auto-bug-check (static analysis + cleanup + Space probe)
        id: check
        continue-on-error: true
        run: |
          python scripts/auto_bug_check.py
          echo "static_exit=$?" >> $GITHUB_OUTPUT

      - name: Probe LIVE Space (real-prediction verification, not just HTTP 200)
        id: live
        continue-on-error: true
        run: |
          python scripts/check_live_status.py
          echo "live_exit=$?" >> $GITHUB_OUTPUT

      - name: Commit auto-cleanups (stale files / whitespace)
        run: |
          git config user.name  "colonai-bot"
          git config user.email "colonai-bot@users.noreply.github.com"
          # Track tracked-file changes (whitespace rewrites, code edits)
          git add -u
          # Force-add the per-run JSON reports under outputs/ (gitignored)
          # so the next run can compare and the issue body can include them.
          git add -f outputs/auto_bug_report.json outputs/live_status.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(auto-bug-check): clean stale files + report ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Open a GitHub issue if there are critical bugs OR Space is unhealthy
        if: steps.check.outputs.static_exit != '0' || steps.live.outputs.live_exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const lines = [];
            lines.push("Daily ColonAI auto-check found issues that need a human:");
            lines.push("");

            // Static-analysis report
            if (fs.existsSync('outputs/auto_bug_report.json')) {
              const r = JSON.parse(fs.readFileSync('outputs/auto_bug_report.json','utf8'));
              if (!r.overall_ok) {
                if (r.syntax_errors.length)
                  lines.push("**Syntax errors:**\n" +
                             r.syntax_errors.map(e => `- \`${e}\``).join("\n"));
                if (r.critical_issues.length)
                  lines.push("\n**Critical (undefined names — would crash at runtime):**\n" +
                             r.critical_issues.map(e => `- \`${e}\``).join("\n"));
                if (r.json_errors.length)
                  lines.push("\n**JSON errors:**\n" +
                             r.json_errors.map(e => `- \`${e}\``).join("\n"));
                if (r.hf_space && !r.hf_space.ok)
                  lines.push(`\n**HF Space HTTP/stage unhealthy:** stage \`${r.hf_space.space_stage || '?'}\` — ${r.hf_space.error || ''}`);
                lines.push(`\n*Soft warnings (cleanup-only): ${r.soft_warnings.length}*`);
              }
            }

            // Live-prediction probe report
            if (fs.existsSync('outputs/live_status.json')) {
              const l = JSON.parse(fs.readFileSync('outputs/live_status.json','utf8'));
              if (l.status !== 'READY') {
                lines.push(`\n**Live Space NOT producing real predictions:** \`${l.status}\` — ${l.reason}`);
                if (l.sidebar_text) {
                  lines.push("\n<details><summary>Sidebar text</summary>\n\n```\n"
                             + l.sidebar_text.substring(0, 1500) + "\n```\n</details>");
                }
                if (l.alerts && l.alerts.length) {
                  lines.push("\n**Alert banners on the page:**\n" +
                             l.alerts.map(a => `- ${a}`).join("\n"));
                }
              }
            }

            lines.push(`\nRun \`python3 scripts/auto_bug_check.py && python3 scripts/check_live_status.py\` locally for full details.`);
            const body = lines.join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🐛 Auto-check: issues on ${new Date().toISOString().slice(0,10)}`,
              body:  body,
              labels:["auto-bug-check"],
            });

[theme]
base = "light"
primaryColor = "#1A73E8"
backgroundColor = "#F8FAFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#212121"
font = "sans serif"

[server]
# Bind to loopback by default — set --server.address 0.0.0.0 only on a
# trusted, authenticated network.
address = "127.0.0.1"
headless = true
port = 8501
# Hard upload size cap (MB). The app's security policy enforces 10 MB at
# the validator level; this Streamlit-side cap is a belt-and-braces guard.
maxUploadSize = 10
# Reject very large messages — protects against memory-pressure attacks
# via repeated chunked uploads.
maxMessageSize = 50
# XSRF protection: DISABLED on purpose. Streamlit's XSRF token check breaks
# file uploads when the app runs behind Hugging Face Spaces' reverse proxy —
# the upload POST fails the token check and every file is rejected with a red
# chip before analysis can run. Real upload safety is enforced server-side in
# src/app/security.validate_upload_bytes (10 MB cap, MIME allow-list,
# decompression-bomb guard), so disabling Streamlit's XSRF loses no protection.
# Re-enable ONLY when serving on a direct, non-proxied origin.
enableXsrfProtection = false
# CORS stays locked down. With XSRF off this is respected as-is (Streamlit would
# otherwise force it on). A hostile page still can't read cross-origin responses.
enableCORS = false

[browser]
gatherUsageStats = false
